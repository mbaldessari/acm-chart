# TODO: Also create a GitOpsCluster.apps.open-cluster-management.io
{{- range .Values.clusterGroup.managedClusterGroups }}
{{- $group := . }}
{{- if ($.Values.global.deletePattern | eq "DeleteSpoke" ) }}
{{- else }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .name }}-clustergroup-policy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: {{ .name }}-clustergroup-config
        spec:
          {{- if or ($.Values.global.deletePattern | eq "DeleteChildApps" ) ($.Values.global.deletePattern | eq "DeleteSpokeChildApps" )}}
          pruneObjectBehavior: DeleteIfCreated
          {{- end }}
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            include:
              - default
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: openshift-gitops-cluster-admin-rolebinding
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-admin
                subjects:
                  - kind: ServiceAccount
                    name: openshift-gitops-argocd-application-controller
                    namespace: openshift-gitops
                  - kind: ServiceAccount
                    name: openshift-gitops-argocd-server
                    namespace: openshift-gitops
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: argoproj.io/v1alpha1
                kind: Application
                metadata:
                  name: {{ $.Values.global.pattern }}-{{ .name }}
                  namespace: openshift-gitops
                  finalizers:
                  - resources-finalizer.argocd.argoproj.io/foreground
                spec:
                  project: default
                  {{- $clusterGroupGitRepoUrl := "" }}
                  {{- $clusterGroupChartGitRevision := "" }}
                  {{- if and $.Values.main $.Values.main.multiSourceConfig }}
                    {{- $clusterGroupGitRepoUrl = $.Values.main.multiSourceConfig.clusterGroupGitRepoUrl }}
                    {{- $clusterGroupChartGitRevision = $.Values.main.multiSourceConfig.clusterGroupChartGitRevision }}
                  {{- end }}
                  {{- if $.Values.global.multiSourceSupport }}
                  sources:
                    - ref: patternref
                      repoURL: {{ coalesce .repoURL $.Values.global.repoURL }}
                      targetRevision: {{ coalesce .targetRevision $.Values.global.targetRevision }}
                    - repoURL: {{ coalesce .repoURL $.Values.global.repoURL }}
                      targetRevision: {{ coalesce .targetRevision $.Values.global.targetRevision }}
                      path: .
                      plugin:
                        name: helm-shared-valuefiles
                        env:
                          - name: PARAM_VALUE_FILES
                            value: |
                              {{- include "acm.app.policies.plugin.valuefiles" . | nindent 30 }}
                              {{- range $valueFile := .extraValueFiles }}
                              {{ $valueFile }}
                              {{- end }}
                          {{- include "acm.app.policies.helmparameters" $ | nindent 26 }}
                          - name: clusterGroup.name
                            value: {{ $group.name }}
                          {{- range $k, $v := $.Values.extraParametersNested }}
                          - name: {{ $k }}
                            value: {{ printf "%s" $v | quote }}
                          {{- end }}
                          {{- range .helmOverrides }}
                          - name: {{ .name }}
                            value: {{ .value | quote }}
                          {{- end }}
                          - name: PARAM_INLINE_VALUES
                            value: |
                              extraParametersNested:
                              {{- range $k, $v := $.Values.extraParametersNested }}
                                {{ $k }}: {{ printf "%s" $v | quote }}
                              {{- end }}
                          {{- if and $.Values.main $.Values.main.multiSourceConfig (hasKey $.Values.main.multiSourceConfig "clusterGroupGitRepoUrl") }}
                          - name: PARAM_CHART_GIT_URL
                            value: {{ $clusterGroupGitRepoUrl }}
                          - name: PARAM_CHART_GIT_REVISION
                            value: {{ coalesce $clusterGroupChartGitRevision $.Values.global.multiSourceTargetRevision }}
                          {{- else }}
                          - name: PARAM_CHART_REPO_URL
                            value: {{ coalesce $clusterGroupGitRepoUrl $.Values.global.multiSourceRepoUrl }}
                          - name: PARAM_CHART_NAME
                            value: clustergroup
                          - name: PARAM_CHART_VERSION
                            value: {{ coalesce $clusterGroupChartGitRevision $.Values.global.multiSourceTargetRevision }}
                          {{- end }}
                  {{- else }}
                  source:
                    repoURL: {{ coalesce .repoURL $.Values.global.repoURL }}
                    targetRevision: {{ coalesce .targetRevision $.Values.global.targetRevision }}
                    path: {{ default "common/clustergroup" .path }}
                    plugin:
                      name: helm-shared-valuefiles
                      env:
                        - name: PARAM_VALUE_FILES
                          value: |
                            {{- include "acm.app.policies.plugin.valuefiles" . | nindent 28 }}
                            {{- range $valueFile := .extraValueFiles }}
                            {{ $valueFile }}
                            {{- end }}
                        {{- include "acm.app.policies.helmparameters" $ | nindent 24 }}
                        - name: clusterGroup.name
                          value: {{ $group.name }}
                        {{- range $k, $v := $.Values.extraParametersNested }}
                        - name: {{ $k }}
                          value: {{ printf "%s" $v | quote }}
                        {{- end }}
                        {{- range .helmOverrides }}
                        - name: {{ .name }}
                          value: {{ .value | quote }}
                        {{- end }}
                        - name: PARAM_INLINE_VALUES
                          value: |
                            extraParametersNested:
                            {{- range $k, $v := $.Values.extraParametersNested }}
                              {{ $k }}: {{ printf "%s" $v | quote }}
                            {{- end }}
                  {{- end }}
                  destination:
                    server: https://kubernetes.default.svc
                    namespace: {{ $.Values.global.pattern }}-{{ .name }}
                  syncPolicy:
                    automated:
                    {{- if ($.Values.global.deletePattern | ne "none" ) }}
                      prune: true
                    {{- else }}
                      prune: false
                    {{- end }}
                      selfHeal: true
                    retry:
                      limit: {{ default 20 $.Values.global.options.applicationRetryLimit }}
                  ignoreDifferences:
                  - group: apps
                    kind: Deployment
                    jsonPointers:
                    - /spec/replicas
                  - group: route.openshift.io
                    kind: Route
                    jsonPointers:
                    - /status
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ .name }}-placement-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: {{ .name }}-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: {{ .name }}-clustergroup-policy
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ .name }}-placement
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
{{- include "acm.app.clusterSelector" (dict
  "clusterSelector" .clusterSelector
  "group" $group
  ) | nindent 2 }}
---
{{- end }}
{{- end }}
