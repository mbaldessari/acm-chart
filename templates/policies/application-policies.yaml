{{- if not .Values.global.vpWrapper }}
# TODO: Also create a GitOpsCluster.apps.open-cluster-management.io
{{- range .Values.clusterGroup.managedClusterGroups }}
{{- $group := . }}
{{- $argoDestNamespace := (printf "%s-%s" $.Values.global.pattern .name) -}}
{{- if $.Values.global.singleArgoCD }}
{{- $argoDestNamespace = $.Values.global.vpArgoNamespace -}}
{{- end }}
{{- if ($.Values.global.deletePattern | eq "DeleteSpoke" ) }}
{{- else }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .name }}-clustergroup-policy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: {{ .name }}-clustergroup-config
        spec:
          {{- if or ($.Values.global.deletePattern | eq "DeleteChildApps" ) ($.Values.global.deletePattern | eq "DeleteSpokeChildApps" )}}
          pruneObjectBehavior: DeleteIfCreated
          {{- end }}
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            include:
              - default
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: {{ $.Values.global.vpArgoNamespace }}-cluster-admin-rolebinding
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-admin
                subjects:
                  - kind: ServiceAccount
                    name: {{ $.Values.global.vpArgoNamespace }}-argocd-application-controller
                    namespace: {{ $.Values.global.vpArgoNamespace }}
                  - kind: ServiceAccount
                    name: {{ $.Values.global.vpArgoNamespace }}-argocd-server
                    namespace: {{ $.Values.global.vpArgoNamespace }}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: argoproj.io/v1alpha1
                kind: Application
                metadata:
                  name: {{ $.Values.global.pattern }}-{{ .name }}-wrapper
                  namespace: {{ $.Values.global.vpArgoNamespace }}
                  annotations:
                    notice.argocd.argoproj.io/severity: info
                    notice.argocd.argoproj.io/content: "App of Apps"
                  labels:
                    validatedpatterns.io/pattern: {{ $.Values.global.pattern }}
                  finalizers:
                  - resources-finalizer.argocd.argoproj.io/foreground
                spec:
                  project: default
                  {{- if $.Values.global.multiSourceSupport }}
                  sources:
                    - repoURL: {{ coalesce .repoURL $.Values.global.repoURL }}
                      targetRevision: {{ coalesce .targetRevision $.Values.global.targetRevision }}
                      ref: patternref
                      {{/* If we're using the clustergroup chart from a git repo let's use those */}}
                      {{- $clusterGroupGitRepoUrl := "" }}
                      {{- if and $.Values.main $.Values.main.multiSourceConfig }}
                        {{- $clusterGroupGitRepoUrl = $.Values.main.multiSourceConfig.clusterGroupGitRepoUrl }}
                      {{- end }}
                      {{- $clusterGroupChartGitRevision := "" }}
                      {{- if and $.Values.main $.Values.main.multiSourceConfig }}
                        {{- $clusterGroupChartGitRevision = $.Values.main.multiSourceConfig.clusterGroupChartGitRevision }}
                      {{- end }}
                    - repoURL: https://github.com/mbaldessari/acm-chart
                      targetRevision: extra-app-on-spokes
                      path: "."
                      helm:
                        ignoreMissingValueFiles: true
                        values: |
                          extraParametersNested:
                          {{- range $k, $v := $.Values.extraParametersNested }}
                            {{ $k }}: {{ printf "%s" $v | quote }}
                          {{- end }}
                        valueFiles:
                        {{- include "acm.app.policies.multisourcevaluefiles" (merge (dict "Values" $.Values) .) | nindent 24 }}
                        {{- range $valueFile := .extraValueFiles }}
                        - {{ $valueFile | quote }}
                        {{- end }}
                        parameters:
                        {{- include "acm.app.policies.helmparameters" $ | nindent 24 }}
                        - name: clusterGroup.name
                          value: {{ $group.name }}
                        {{- range $k, $v := $.Values.extraParametersNested }}
                        - name: {{ $k }}
                          value: {{ printf "%s" $v | quote }}
                        {{- end }}
                       {{- range .helmOverrides }}
                        - name: {{ .name }}
                          value: {{ .value | quote }}
                       {{- end }}
                       {{- if .fileParameters }}
                        fileParameters:
                        {{- range .fileParameters }}
                        - name: {{ .name }}
                          path: {{ .path }}
                        {{- end }}
                       {{- end }}
                        - name: global.vpWrapper
                          value: "true"
                  {{- else }}
                  source:
                    repoURL: {{ coalesce .repoURL $.Values.global.repoURL }}
                    targetRevision: {{ coalesce .targetRevision $.Values.global.targetRevision }}
                    path: {{ default "common/clustergroup" .path }}
                    helm:
                      ignoreMissingValueFiles: true
                      values: |
                        extraParametersNested:
                        {{- range $k, $v := $.Values.extraParametersNested }}
                          {{ $k }}: {{ printf "%s" $v | quote }}
                        {{- end }}
                      valueFiles:
                      {{- include "acm.app.policies.valuefiles" (merge (dict "Values" $.Values) .) | nindent 22 }}
                      {{- range $valueFile := .extraValueFiles }}
                      - {{ $valueFile | quote }}
                      {{- end }}
                      parameters:
                      {{- include "acm.app.policies.helmparameters" $ | nindent 22 }}
                      - name: clusterGroup.name
                        value: {{ $group.name }}
                      {{- range $k, $v := $.Values.extraParametersNested }}
                      - name: {{ $k }}
                        value: {{ printf "%s" $v | quote }}
                      {{- end }}
                     {{- range .helmOverrides }}
                      - name: {{ .name }}
                        value: {{ .value | quote }}
                     {{- end }}
                     {{- if .fileParameters }}
                      fileParameters:
                      {{- range .fileParameters }}
                      - name: {{ .name }}
                        path: {{ .path }}
                      {{- end }}
                     {{- end }}
                  {{- end }}{{/* if $.Values.global.multiSourceSupport */}}
                  destination:
                    server: https://kubernetes.default.svc
                    namespace: {{ $argoDestNamespace }}
                  info:
                    - name: "VP"
                      value: "https://validatedpatterns.io APP OF APPS"
                  syncPolicy:
                    automated:
                    {{- if ($.Values.global.deletePattern | ne "none" ) }}
                      prune: true
                    {{- else }}
                      prune: false
                    {{- end }}
                      selfHeal: true
                    retry:
                      limit: {{ default 20 $.Values.global.options.applicationRetryLimit }}
                      {{- with $.Values.global.options.applicationRetryBackoff }}
                      backoff:
                        duration: {{ .duration | quote }}
                        factor: {{ .factor }}
                        maxDuration: {{ .maxDuration | quote }}
                      {{- end }}
                  ignoreDifferences:
                  - group: apps
                    kind: Deployment
                    jsonPointers:
                    - /spec/replicas
                  - group: route.openshift.io
                    kind: Route
                    jsonPointers:
                    - /status
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ .name }}-placement-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: {{ .name }}-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: {{ .name }}-clustergroup-policy
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ .name }}-placement
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
{{- include "acm.app.clusterSelector" (dict
  "clusterSelector" .clusterSelector
  "group" $group
  ) | nindent 2 }}
---
{{- end }}
{{- end }}
{{- end }}{{/* if not .Values.global.vpWrapper */}}
