{{- if not .Values.global.vpWrapper }}
# We copy the vp-private-repo-credentials from the ArgoCD namespace
# to the "open-cluster-management" via the "private-hub-policy"
#
# Then we copy the secret from the "open-cluster-management" namespace to the
# managed clusters ArgoCD instance
#
# And we also copy the same secret to the namespaced argo's namespace
{{ if $.Values.global.privateRepo }}
{{- range .Values.clusterGroup.managedClusterGroups }}
{{- $group := . }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: private-{{ .name }}-policy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: private-{{ .name }}-config
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            include:
              - default
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                kind: Secret
                apiVersion: v1
                type: Opaque
                metadata:
                  name: vp-private-repo-credentials
                  namespace: {{ $.Values.global.vpArgoNamespace }}
                  labels:
                    argocd.argoproj.io/secret-type: repository
                data: '{{ `{{hub copySecretData "open-cluster-management" "vp-private-repo-credentials" hub}}` }}'
            - complianceType: mustonlyhave
              objectDefinition:
                kind: Secret
                apiVersion: v1
                type: Opaque
                metadata:
                  name: vp-private-repo-credentials
                  namespace: {{ $.Values.global.pattern }}-{{ .name }}
                  labels:
                    argocd.argoproj.io/secret-type: repository
                data: '{{ `{{hub copySecretData "open-cluster-management" "vp-private-repo-credentials" hub}}` }}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: private-{{ .name }}-placement-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: private-{{ .name }}-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: private-{{ .name }}-policy
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: private-{{ .name }}-placement
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
{{- include "acm.app.clusterSelector" (dict
  "clusterSelector" .clusterSelector
  "group" $group
  ) | nindent 2 }}
---
{{- end }}{{- /* range .Values.clusterGroup.managedClusterGroups */}}
{{ if eq (include "acm.ishubcluster" $) "true" }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vp-private-hub-policy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: private-hub-config
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            include:
              - default
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                kind: Secret
                apiVersion: v1
                type: Opaque
                metadata:
                  name: vp-private-repo-credentials
                  namespace: open-cluster-management
                  labels:
                    argocd.argoproj.io/secret-type: repository
                data: '{{ `{{copySecretData "` }}{{ $.Values.global.vpArgoNamespace }}{{ `" "vp-private-repo-credentials"}}` }}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: vp-private-hub-placement-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: vp-private-hub-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: vp-private-hub-policy
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: vp-private-hub-placement
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: In
              values:
                - 'true'
---
{{ end }}{{- /* if ishubcluster */}}
{{- end }}{{- /* if $.Values.global.privateRepo */}}
{{- end }}{{/* if not .Values.global.vpWrapper */}}
