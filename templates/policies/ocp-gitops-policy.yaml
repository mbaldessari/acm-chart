{{- range .Values.clusterGroup.managedClusterGroups }}
{{- $group := . }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .name }}-gitops-policy
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS Data Security
    policy.open-cluster-management.io/controls: PR.DS-1 Data-at-rest
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: {{ .name }}-gitops-config
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            include:
              - default
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                # This is an auto-generated file. DO NOT EDIT
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-gitops-operator
                  namespace: {{ if $.Values.global.gitOpsSubNamespace }}{{ $.Values.global.gitOpsSubNamespace }}{{ else }}openshift-operators{{ end }}
                spec:
                  channel: {{- if and $.Values.acm.spokeGitops $.Values.acm.spokeGitops.channel }} {{ $.Values.acm.spokeGitops.channel }}{{- else if and $.Values.main $.Values.main.gitops $.Values.main.gitops.channel }} {{ $.Values.main.gitops.channel }}{{- else }} gitops-1.18{{- end }}
                  installPlanApproval: Automatic
                  name: openshift-gitops-operator
                  source: {{- if and $.Values.acm.spokeGitops $.Values.acm.spokeGitops.source }} {{ $.Values.acm.spokeGitops.source }}{{- else if and $.Values.main $.Values.main.gitops $.Values.main.gitops.operatorSource }} {{ $.Values.main.gitops.operatorSource }}{{- else }} redhat-operators{{- end }}
                  sourceNamespace: openshift-marketplace
                  config:
                    env:
                      - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
                        value: "*"
                      - name: DISABLE_DEFAULT_ARGOCD_INSTANCE
                        value: "true"
            - complianceType: musthave
              objectDefinition:
                kind: ConfigMap
                apiVersion: v1
                metadata:
                  name: trusted-ca-bundle
                  namespace: openshift-gitops
                  labels:
                    config.openshift.io/inject-trusted-cabundle: 'true'
            {{- if and $.Values.global.gitOpsSubNamespace (ne $.Values.global.gitOpsSubNamespace "openshift-operators") }}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ $.Values.global.gitOpsSubNamespace }}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: {{ $.Values.global.gitOpsSubNamespace }}-operator-group
                  namespace: {{ $.Values.global.gitOpsSubNamespace }}
                spec:
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ .name }}-gitops-placement-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: {{ .name }}-gitops-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: {{ .name }}-gitops-policy
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ .name }}-gitops-placement
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
{{- include "acm.app.clusterSelector" (dict
  "clusterSelector" .clusterSelector
  "group" $group
  ) | nindent 2 }}
---
# This policy depends on openshift-gitops-policy and the reason is that we need to be
# certain that the trusted-ca-bundle exists before spawning the clusterwide argocd instance
# because the initcontainer references the trusted-ca-bundle and if it starts without the
# configmap being there we risk running an argo instances that won't trust public CAs
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .name }}-gitops-policy-argocd
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS Data Security
    policy.open-cluster-management.io/controls: PR.DS-1 Data-at-rest
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: {{ .name }}-gitops-config-argocd
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            include:
              - default
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: cmp-shared-valuefiles
                  namespace: openshift-gitops
                type: Opaque
                data:
                  plugin.yaml: {{ $.Files.Get "files/cmp/plugin.yaml" | b64enc }}
                  generate.sh: {{ $.Files.Get "files/cmp/generate.sh" | b64enc }}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: argoproj.io/v1beta1
                kind: ArgoCD
                metadata:
                  name: openshift-gitops
                  namespace: openshift-gitops
                spec:
                  applicationSet:
                    resources:
                      limits:
                        cpu: "2"
                        memory: 1Gi
                      requests:
                        cpu: 250m
                        memory: 512Mi
                    webhookServer:
                      ingress:
                        enabled: false
                      route:
                        enabled: false
                  controller:
                    processors: {}
                    resources:
                      limits:
                        cpu: "2"
                        memory: 2Gi
                      requests:
                        cpu: 250m
                        memory: 1Gi
                    sharding: {}
                  grafana:
                    enabled: false
                    ingress:
                      enabled: false
                    resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 250m
                        memory: 128Mi
                    route:
                      enabled: false
                  ha:
                    enabled: false
                    resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 250m
                        memory: 128Mi
                  initialSSHKnownHosts: {}
                  monitoring:
                    enabled: false
                  notifications:
                    enabled: false
                  prometheus:
                    enabled: false
                    ingress:
                      enabled: false
                    route:
                      enabled: false
                  rbac:
                    defaultPolicy: role:readonly
                    policy: |-
                      g, system:cluster-admins, role:admin
                      g, cluster-admins, role:admin
                      g, admin, role:admin
                    scopes: '[groups,email]'
                  redis:
                    resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 250m
                        memory: 128Mi
                  repo:
                    initContainers:
                    - command:
                      - bash
                      - -c
                      - cat /var/run/kube-root-ca/ca.crt /var/run/trusted-ca/ca-bundle.crt /var/run/trusted-hub/hub-kube-root-ca.crt > /tmp/ca-bundles/ca-bundle.crt
                        || true
                      image: registry.redhat.io/ubi9/ubi-minimal:latest
                      name: fetch-ca
                      resources: {}
                      volumeMounts:
                      - mountPath: /var/run/kube-root-ca
                        name: kube-root-ca
                      - mountPath: /var/run/trusted-ca
                        name: trusted-ca-bundle
                      - mountPath: /var/run/trusted-hub
                        name: trusted-hub-bundle
                      - mountPath: /tmp/ca-bundles
                        name: ca-bundles
                    sidecarContainers:
                    - name: cmp-shared-valuefiles
                      command:
                      - /var/run/argocd/argocd-cmp-server
                      image: '{{ `{{ (index (lookup "apps/v1" "Deployment" "openshift-gitops" "openshift-gitops-repo-server").spec.template.spec.containers 0).image }}` }}'
                      env:
                      - name: HOME
                        value: /tmp
                      securityContext:
                        runAsNonRoot: true
                      volumeMounts:
                      - mountPath: /var/run/argocd
                        name: var-files
                      - mountPath: /home/argocd/cmp-server/plugins
                        name: plugins
                      - mountPath: /home/argocd/cmp-server/config/plugin.yaml
                        name: cmp-shared-valuefiles
                        subPath: plugin.yaml
                      - mountPath: /scripts/generate.sh
                        name: cmp-shared-valuefiles
                        subPath: generate.sh
                      - mountPath: /tmp
                        name: cmp-tmp
                      - mountPath: /etc/pki/tls/certs
                        name: ca-bundles
                    resources:
                      limits:
                        cpu: "1"
                        memory: 1Gi
                      requests:
                        cpu: 250m
                        memory: 256Mi
                    volumeMounts:
                    - mountPath: /etc/pki/tls/certs
                      name: ca-bundles
                    volumes:
                    - configMap:
                        name: kube-root-ca.crt
                      name: kube-root-ca
                    - configMap:
                        name: trusted-ca-bundle
                      name: trusted-ca-bundle
                    - configMap:
                        name: trusted-hub-bundle
                      name: trusted-hub-bundle
                    - emptyDir: {}
                      name: ca-bundles
                    - secret:
                        secretName: cmp-shared-valuefiles
                        defaultMode: 0755
                      name: cmp-shared-valuefiles
                    - emptyDir: {}
                      name: cmp-tmp
                  resourceExclusions: |-
                    - apiGroups:
                      - tekton.dev
                      clusters:
                      - '*'
                      kinds:
                      - TaskRun
                      - PipelineRun
                  # Custom Subscription healthcheck to handle manual approval scenarios
                  resourceHealthChecks:
                    - group: operators.coreos.com
                      kind: Subscription
                      check: |
{{- include "acm.subscription.healthcheck.lua" . | nindent 24 }}
                  server:
                    autoscale:
                      enabled: false
                    grpc:
                      ingress:
                        enabled: false
                    ingress:
                      enabled: false
                    resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 125m
                        memory: 128Mi
                    route:
                      enabled: true
                      {{- if and ($.Values.global.argocdServer) ($.Values.global.argocdServer.route) ($.Values.global.argocdServer.route.tls) }}
                      tls:
                        insecureEdgeTerminationPolicy: {{ default "Redirect" $.Values.global.argocdServer.route.tls.insecureEdgeTerminationPolicy }}
                        termination: {{ default "reencrypt" $.Values.global.argocdServer.route.tls.termination }}
                      {{- end }}
                    service:
                      type: ""
                  sso:
                    dex:
                      openShiftOAuth: true
                      resources:
                        limits:
                          cpu: 500m
                          memory: 256Mi
                        requests:
                          cpu: 250m
                          memory: 128Mi
                    provider: dex
                  tls:
                    ca: {}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ .name }}-gitops-placement-binding-argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: {{ .name }}-gitops-placement-argocd
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: {{ .name }}-gitops-policy-argocd
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ .name }}-gitops-placement-argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
{{- include "acm.app.clusterSelector" (dict
  "clusterSelector" .clusterSelector
  "group" $group
  ) | nindent 2 }}
---
{{- end }}
