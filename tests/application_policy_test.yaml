
suite: Test argo application installation policy
templates:
  - templates/policies/application-policies.yaml
release:
  name: release-test
tests:

  - it: Should render the clusterselector when using acmlabels
    values:
      - ./clusterselector_values.yaml
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-one

  - it: Should render the clusterselector when using acmlabels with an override
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels:
              - name: clusterGroup
                value: group-two
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-two

  - it: Should render the clusterselector when using json
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            clusterSelector:
              foo: bar
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector
          value: {foo: bar}

  - it: Should render the clusterselector when acmlabels is empty
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels: {}
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-two

  - it: Should render the clusterselector when acmlabels is unset
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels: nil
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-two

  # Test for openshift-gitops-cluster-admin-rolebinding CRB
  - it: Should precreate the openshift-gitops-cluster-admin-rolebinding ClusterRoleBinding
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.kind
          value: ClusterRoleBinding
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.metadata.name
          value: openshift-gitops-cluster-admin-rolebinding
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.roleRef.kind
          value: ClusterRole
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.roleRef.name
          value: cluster-admin
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].complianceType
          value: mustonlyhave
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.subjects
          content:
            kind: ServiceAccount
            name: openshift-gitops-argocd-application-controller
            namespace: openshift-gitops
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.subjects
          content:
            kind: ServiceAccount
            name: openshift-gitops-argocd-server
            namespace: openshift-gitops

  # Tests for clusterGroupGitRepoUrl and clusterGroupChartGitRevision
  # With the new format, the second source is always the pattern git repo with plugin.
  # Chart info is passed via PARAM_CHART_* env vars, not source-level chart/repoURL.
  - it: Should pass PARAM_CHART_REPO_URL when clusterGroupGitRepoUrl is not set
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].path
          value: "."
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: PARAM_CHART_REPO_URL
            value: "https://charts.example.com"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: PARAM_CHART_NAME
            value: clustergroup
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: PARAM_CHART_VERSION
            value: "0.1.0"

  - it: Should pass PARAM_CHART_GIT_URL when clusterGroupGitRepoUrl is set
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
      main:
        multiSourceConfig:
          clusterGroupGitRepoUrl: "https://github.com/example/clustergroup-chart"
          clusterGroupChartGitRevision: "feature-branch"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].path
          value: "."
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: PARAM_CHART_GIT_URL
            value: "https://github.com/example/clustergroup-chart"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: PARAM_CHART_GIT_REVISION
            value: "feature-branch"

  - it: Should use clusterGroupGitRepoUrl with fallback to multiSourceTargetRevision when only clusterGroupGitRepoUrl is set
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
      main:
        multiSourceConfig:
          clusterGroupGitRepoUrl: "https://github.com/example/clustergroup-chart"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: PARAM_CHART_GIT_URL
            value: "https://github.com/example/clustergroup-chart"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: PARAM_CHART_GIT_REVISION
            value: "0.1.0"

  - it: should render a spoke app of apps with individual env var parameters (no deletePattern set)
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
      main:
        multiSourceConfig:
          clusterGroupGitRepoUrl: "https://github.com/example/clustergroup-chart"
          clusterGroupChartGitRevision: "feature-branch"
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: global.deletePattern
            value: null
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: clusterGroup.name
            value: group-one

  - it: should render a spoke app of apps with individual env var parameters (if deletePattern set to DeleteSpokeChildApps)
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
        deletePattern: DeleteSpokeChildApps
      main:
        multiSourceConfig:
          clusterGroupGitRepoUrl: "https://github.com/example/clustergroup-chart"
          clusterGroupChartGitRevision: "feature-branch"
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: global.deletePattern
            value: "DeleteChildApps"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].plugin.env
          content:
            name: clusterGroup.name
            value: group-one

  - it: should not render a spoke app of apps (if deletePattern set to DeleteSpoke)
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
        deletePattern: DeleteSpoke
      main:
        multiSourceConfig:
          clusterGroupGitRepoUrl: "https://github.com/example/clustergroup-chart"
          clusterGroupChartGitRevision: "feature-branch"
    asserts:
      - hasDocuments:
          count: 0
