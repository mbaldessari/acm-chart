
suite: Test argo application installation policy
templates:
  - templates/policies/application-policies.yaml
release:
  name: release-test
tests:

  - it: Should render the clusterselector when using acmlabels
    values:
      - ./clusterselector_values.yaml
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-placement
        equal:
          path: spec.clusterSelector.matchLabels.clusterGroup
          value: group-one

  - it: Should render the clusterselector when using acmlabels with an override
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels:
              - name: clusterGroup
                value: group-two
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.clusterSelector.matchLabels.clusterGroup
          value: group-two

  - it: Should render the clusterselector when using json
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            clusterSelector:
              foo: bar
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-placement
        equal:
          path: spec.clusterSelector
          value: {foo: bar}

  - it: Should render the clusterselector when acmlabels is empty
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels: {}
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.clusterSelector.matchLabels.clusterGroup
          value: group-two

  - it: Should render the clusterselector when acmlabels is unset
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels: nil
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.clusterSelector.matchLabels.clusterGroup
          value: group-two

  - it: Should render sharedValueFiles in single-source mode
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-test
            sharedValueFiles:
              - '/test/values-{{ $.Values.global.clusterPlatform }}.yaml'
              - '/test/values-{{ $.Values.clusterGroup.name }}.yaml'
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-test-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.spec.source.helm.valueFiles
          content: '{{ tpl "/test/values-{{ $.Values.global.clusterPlatform }}.yaml" $ }}'
      - documentSelector:
          path: metadata.name
          value: group-test-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.spec.source.helm.valueFiles
          content: '{{ tpl "/test/values-{{ $.Values.clusterGroup.name }}.yaml" $ }}'

  - it: Should render sharedValueFiles in multi-source mode
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: https://charts.validatedpatterns.io/
        multiSourceTargetRevision: main
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-test
            sharedValueFiles:
              - '/test/values-{{ $.Values.global.clusterPlatform }}.yaml'
              - '/test/values-{{ $.Values.clusterGroup.name }}.yaml'
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-test-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.spec.sources[1].helm.valueFiles
          content: '{{ tpl "/test/values-{{ $.Values.global.clusterPlatform }}.yaml" $ }}'
      - documentSelector:
          path: metadata.name
          value: group-test-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.spec.sources[1].helm.valueFiles
          content: '{{ tpl "/test/values-{{ $.Values.clusterGroup.name }}.yaml" $ }}'

