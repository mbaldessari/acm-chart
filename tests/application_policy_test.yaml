
suite: Test argo application installation policy
templates:
  - templates/policies/application-policies.yaml
release:
  name: release-test
tests:

  - it: Should render the clusterselector when using acmlabels
    values:
      - ./clusterselector_values.yaml
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-one

  - it: Should render the clusterselector when using acmlabels with an override
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels:
              - name: clusterGroup
                value: group-two
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-two

  - it: Should render the clusterselector when using json
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            clusterSelector:
              foo: bar
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector
          value: {foo: bar}

  - it: Should render the clusterselector when acmlabels is empty
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels: {}
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-two

  - it: Should render the clusterselector when acmlabels is unset
    values:
      - ./clusterselector_values.yaml
    set:
      clusterGroup:
        managedClusterGroups:
          exampleRegion:
            name: group-two
            acmlabels: nil
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-two-placement
        equal:
          path: spec.predicates[0].requiredClusterSelector.labelSelector.matchLabels.clusterGroup
          value: group-two

  # Test for cluster-admin-rolebinding CRB (uses default vpArgoNamespace: openshift-gitops)
  - it: Should precreate the cluster-admin-rolebinding ClusterRoleBinding
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.kind
          value: ClusterRoleBinding
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.metadata.name
          value: openshift-gitops-cluster-admin-rolebinding
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.roleRef.kind
          value: ClusterRole
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.roleRef.name
          value: cluster-admin
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].complianceType
          value: mustonlyhave
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.subjects
          content:
            kind: ServiceAccount
            name: openshift-gitops-argocd-application-controller
            namespace: openshift-gitops
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        contains:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[0].objectDefinition.subjects
          content:
            kind: ServiceAccount
            name: openshift-gitops-argocd-server
            namespace: openshift-gitops

  # Tests for super chart source configuration
  - it: Should use chart clustergroup-super when no git overrides are set
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].chart
          value: clustergroup-super
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].repoURL
          value: "https://charts.example.com"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].targetRevision
          value: "0.1.0"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        isNull:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].path

  - it: Should use path when superChartGitRepoUrl is set
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
      main:
        multiSourceConfig:
          superChartGitRepoUrl: "https://github.com/example/acm-chart"
          superChartGitRevision: "feature-branch"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].path
          value: "charts/clustergroup-super"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].repoURL
          value: "https://github.com/example/acm-chart"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].targetRevision
          value: "feature-branch"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        isNull:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].chart

  - it: Should pass clusterGroupSource config in values block
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
      main:
        multiSourceConfig:
          clusterGroupGitRepoUrl: "https://github.com/example/clustergroup-chart"
          clusterGroupChartGitRevision: "cg-branch"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        matchRegex:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.values
          pattern: "useGitRepo: true"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        matchRegex:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.values
          pattern: 'gitRepoUrl: "https://github.com/example/clustergroup-chart"'
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        matchRegex:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.values
          pattern: 'gitRevision: "cg-branch"'

  - it: should render a spoke app of apps with the correct helm parameters (no deletePattern set)
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        lengthEqual:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.parameters
          count: 20 # 19 (in the helper) + 1 (clusterGroup.name); helmOverrides now in values block
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.parameters[16].name
          value: "global.deletePattern"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.parameters[16].value
          value: null

  - it: should pass helmOverrides in the values block
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
    asserts:
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        matchRegex:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.values
          pattern: "helmOverrides:"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        matchRegex:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.values
          pattern: "name: clusterGroup.isHubCluster"

  - it: should render a spoke app of apps with the correct helm parameters (if deletePattern set to DeleteSpokeChildApps)
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
        deletePattern: DeleteSpokeChildApps
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        lengthEqual:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.parameters
          count: 20 # 19 (in the helper) + 1 (clusterGroup.name); helmOverrides now in values block
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.parameters[16].name
          value: "global.deletePattern"
      - documentSelector:
          path: metadata.name
          value: group-one-clustergroup-policy
        equal:
          path: spec.policy-templates[0].objectDefinition.spec.object-templates[1].objectDefinition.spec.sources[1].helm.parameters[16].value
          value: "DeleteChildApps"

  - it: should not render a spoke app of apps (if deletePattern set to DeleteSpoke)
    values:
      - ./clusterselector_values.yaml
    set:
      global:
        multiSourceSupport: true
        multiSourceRepoUrl: "https://charts.example.com"
        multiSourceTargetRevision: "0.1.0"
        deletePattern: DeleteSpoke
    asserts:
      - hasDocuments:
          count: 0
